server {
    listen 80;
    server_name localhost;

    # Forward API calls to the Go backend (auth + model proxy). The backend
    # service must share this container's Docker network (see docs/DEPLOYMENT.md).
    # The variable upstream + Docker embedded DNS resolver (127.0.0.11) means
    # Nginx still starts if no backend is present (e.g. widget-only testing) —
    # /api just returns 502 instead of the server failing to boot.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # chat streaming (SSE)
        proxy_buffering off;
    }

    # The widget loader is embedded on third-party pages under a stable,
    # non-hashed URL, and the build rewrites it in place (npm run
    # build:widget-assets splices the design tokens + icons into it). Without an
    # explicit directive, shared caches on the embedding side (Varnish, CDN,
    # corporate proxy) apply heuristic freshness — 10% of the time since
    # Last-Modified is typical — and pin every embedding page to an old loader
    # with no way to bust it. Short TTL + revalidation instead of `immutable`,
    # precisely because the URL carries no content hash.
    location = /widget.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
